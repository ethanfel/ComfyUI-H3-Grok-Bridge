<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" viewBox="0 0 620 230" role="img" aria-labelledby="title desc">
  <title id="title">H3 Grok Bridge node</title>
  <desc id="desc">A compact ComfyUI node with an H3 Plan input, an optional project name, and a Plan output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <linearGradient id="titlebar" x1="0" x2="1">
      <stop offset="0" stop-color="#654785"/>
      <stop offset="1" stop-color="#46345d"/>
    </linearGradient>
  </defs>
  <rect width="620" height="230" rx="18" fill="#17191f"/>
  <g filter="url(#shadow)">
    <rect x="115" y="25" width="390" height="180" rx="11" fill="#292c34" stroke="#686d7b"/>
    <path d="M126 25h368a11 11 0 0 1 11 11v34H115V36a11 11 0 0 1 11-11z" fill="url(#titlebar)"/>
    <text x="139" y="54" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="650">H3 Grok Bridge</text>
    <circle cx="115" cy="99" r="7" fill="#b59ce8" stroke="#e4daf8" stroke-width="1.5"/>
    <text x="133" y="105" fill="#e4e6ec" font-family="Inter,system-ui,sans-serif" font-size="14">H3 Plan</text>
    <text x="464" y="105" fill="#e4e6ec" font-family="Inter,system-ui,sans-serif" font-size="14" text-anchor="end">plan</text>
    <circle cx="505" cy="99" r="7" fill="#b59ce8" stroke="#e4daf8" stroke-width="1.5"/>
    <text x="133" y="137" fill="#b8bdc9" font-family="Inter,system-ui,sans-serif" font-size="12">Project name (optional)</text>
    <rect x="133" y="147" width="354" height="38" rx="7" fill="#17191f" stroke="#555b69"/>
    <text x="150" y="171" fill="#747b8a" font-family="Inter,system-ui,sans-serif" font-size="13">uses Plan run name</text>
  </g>
