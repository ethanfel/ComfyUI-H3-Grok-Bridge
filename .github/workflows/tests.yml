name: tests

on:
  push:
  pull_request:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/test_bridge.py
      - run: python tests/test_cli.py
      - run: node tests/test_core.mjs
      - run: node tests/test_frontend.mjs
      - run: python tests/test_sync.py
      - run: python h3-grok --help
